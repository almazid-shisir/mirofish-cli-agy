[project]
name = "mirofish-cli-agy"
version = "0.1.0"
description = "Universal Swarm Intelligence & Social Simulation Prediction Engine powered by Google Antigravity CLI (agy) and Claude Code CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "almazid-shisir" },
    { name = "MiroFish Team" }
]
keywords = [
    "swarm-intelligence",
    "multi-agent",
    "simulation",
    "prediction-engine",
    "antigravity",
    "gemini",
    "graphrag",
    "camel-oasis",
    "social-simulation",
    "claude-code"
]

dependencies = [
    # OpenAI SDK (required by camel-ai/oasis simulation engine)
    "openai>=1.0.0",
    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # camel-ai imports mcp.server.FastMCP, removed in mcp 2.x (uv tool install ignores uv.lock)
    "mcp<2",
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "kuzu>=0.11.3",
]

[project.scripts]
mirofish = "app.cli:main"
mirofish-agy = "app.cli:main"
mirofish-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
